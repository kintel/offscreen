name: Offscreen

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      enable_ssh:
        type: boolean
        description: 'Enable ssh'
        required: false
        default: false

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-14, windows-latest]

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: libglvnd-dev libglfw3-dev libglu1-mesa-dev libegl1-mesa-dev libgbm-dev xvfb
        version: 1.0
      if: runner.os == 'Linux'
    - run: brew install glfw
      if: runner.os == 'macOS'

    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_ssh }}

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      env:
        LIBGL_ALWAYS_SOFTWARE: "1"
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          xvfb-run ctest --output-on-failure -C ${{env.BUILD_TYPE}}
        else
          ctest --output-on-failure -C ${{env.BUILD_TYPE}}
        fi
      shell: bash

    - name: Upload Test Results
      uses: actions/upload-artifact@v6
      if: ${{ always() }}
      with:
        name: Test Results(${{ matrix.os }})
        path: |
          build/Testing/Temporary/LastTest.log
          build/out.png
          build/out_320x240.png

